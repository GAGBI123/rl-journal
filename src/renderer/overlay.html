<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>RL Journal timer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      .pill {
        position: absolute;
        inset: 4px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 10px 0 14px;
        border-radius: 16px;
        background: rgba(10, 15, 28, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #eef2fa;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      }
      .pill.paused {
        border-color: rgba(250, 178, 25, 0.5);
      }
      .info {
        flex: 1;
        min-width: 0;
      }
      .label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #a9b6cf;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 3px;
        flex: 0 0 auto;
        background: var(--c, #3b82f6);
      }
      .time {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.5px;
        font-variant-numeric: tabular-nums;
        line-height: 1.15;
      }
      .state {
        font-size: 11px;
        font-weight: 600;
        color: #ffd27a;
        margin-left: 6px;
      }
      .bar {
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        margin-top: 4px;
      }
      .bar > div {
        height: 100%;
        background: var(--c, #3b82f6);
      }
      button {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.08);
        color: #eef2fa;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.16);
      }
      button svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="pill hidden" id="pill">
      <div class="info">
        <div class="label"><span class="dot"></span><span id="label"></span></div>
        <div class="time"><span id="time">0:00</span><span class="state hidden" id="state">PAUSED</span></div>
        <div class="bar"><div id="bar" style="width: 0%"></div></div>
      </div>
      <button id="toggle" title="Pause / resume" aria-label="Pause or resume the timer"></button>
    </div>
    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
