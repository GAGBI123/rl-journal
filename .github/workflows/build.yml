# Builds the Windows installer and the Linux AppImage.
# On a version tag (v1.2.3) the files are also published as a GitHub release,
# which is where installed apps look for updates.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Package
        run: npx electron-builder --${{ matrix.target }} --x64 --publish never
        env:
          # Only used to raise GitHub download rate limits for build tools.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test (start the AppImage headless)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          chmod +x release/RL-Journal-x86_64.AppImage
          export RLJ_SMOKE_TEST=1 RLJ_USER_DATA="$RUNNER_TEMP/rlj-smoke"
          timeout 90 xvfb-run -a release/RL-Journal-x86_64.AppImage --no-sandbox 2>&1 | tee smoke.log || true
          grep -q RLJ_SMOKE_OK smoke.log

      - name: Overlay check (Wayland desktop -> XWayland, overlay above other windows)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get install -y -qq x11-utils
          export RLJ_SMOKE_TEST=1 RLJ_SMOKE_OVERLAY=1 RLJ_USER_DATA="$RUNNER_TEMP/rlj-overlay" XDG_SESSION_TYPE=wayland
          # A stand-in for the game, so the overlay sees "RocketLeague.exe" running.
          bash -c 'exec -a RocketLeague.exe sleep 300' &
          timeout 150 xvfb-run -a bash scripts/ci-overlay-check.sh release/RL-Journal-x86_64.AppImage 2>&1 | tee overlay.log || true
          grep -q OVERLAY_CHECK_OK overlay.log

      - uses: actions/upload-artifact@v4
        with:
          name: rl-journal-${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.AppImage
            release/latest*.yml

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          {
            if [ -f "release-notes/$TAG.md" ]; then cat "release-notes/$TAG.md"; echo; fi
            echo "## Download"
            echo
            echo "- **Windows:** \`RL-Journal-Setup-$VERSION.exe\`. Run it to install, or to update an older version."
            echo "- **Linux:** \`RL-Journal-x86_64.AppImage\`. Make it executable, then double-click it."
            echo
            echo "Already installed? The app updates itself. Your journal is never replaced."
            echo
            echo "[Code signing policy](https://github.com/$GITHUB_REPOSITORY#code-signing-policy) · [Privacy policy](https://github.com/$GITHUB_REPOSITORY#privacy-policy) · [MIT license](https://github.com/$GITHUB_REPOSITORY/blob/main/LICENSE)"
          } > notes.md
          ls -la out
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "RL Journal $VERSION" --notes-file notes.md --latest
          fi
