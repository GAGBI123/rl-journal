<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1a2456"/>
      <stop offset="0.5" stop-color="#0b1029"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.18" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#4d8dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4d8dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="0.95" cy="1" r="0.65">
      <stop offset="0" stop-color="#ff7a3d" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="70" y1="452" x2="330" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a3d" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ff7a3d"/>
      <stop offset="0.66" stop-color="#b05cff"/>
      <stop offset="1" stop-color="#4d8dff"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.36" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e3e9f7"/>
      <stop offset="0.85" stop-color="#9aa6c4"/>
      <stop offset="1" stop-color="#6f7c9e"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a3d"/>
      <stop offset="0.5" stop-color="#b05cff"/>
      <stop offset="1" stop-color="#4d8dff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="16" y="16" width="480" height="480" rx="118"/>
    </clipPath>
    <clipPath id="sphere">
      <circle cx="326" cy="188" r="98"/>
    </clipPath>
    <filter id="blur24" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="16" y="16" width="480" height="480" fill="url(#glowBlue)"/>
    <rect x="16" y="16" width="480" height="480" fill="url(#glowOrange)"/>
    <!-- pitch lines -->
    <circle cx="256" cy="256" r="172" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="6"/>
    <path d="M16 496 L496 16" stroke="#ffffff" stroke-opacity="0.035" stroke-width="6"/>
    <!-- boost trail: glow, body, hot core -->
    <path d="M58 466 L262 132 L392 262 Z" fill="url(#trail)" opacity="0.55" filter="url(#blur24)"/>
    <path d="M70 452 L268 136 L386 254 Z" fill="url(#trail)"/>
    <path d="M118 400 L300 172 L352 224 Z" fill="#ffffff" opacity="0.22"/>
    <!-- speed streaks -->
    <path d="M46 344 L178 212" stroke="url(#streak)" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
    <path d="M176 470 L300 346" stroke="url(#streak)" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- ball -->
  <circle cx="326" cy="188" r="112" fill="#4d8dff" opacity="0.45" filter="url(#blur24)"/>
  <circle cx="326" cy="188" r="98" fill="url(#ball)"/>
  <g clip-path="url(#sphere)" fill="none" stroke="#1b2443" stroke-opacity="0.28" stroke-width="6" stroke-linejoin="round">
    <path d="M326 150 L359 169 L359 207 L326 226 L293 207 L293 169 Z" fill="#1b2443" fill-opacity="0.06"/>
    <path d="M326 150 L326 106 M359 169 L397 147 M359 207 L397 229 M326 226 L326 270 M293 207 L255 229 M293 169 L255 147"/>
    <path d="M326 106 L364 84 M326 106 L288 84 M397 147 L397 103 M397 229 L435 207 M326 270 L364 292 M255 229 L217 207 M255 147 L255 103"/>
    <path d="M397 147 L435 169 M397 229 L397 273 M255 229 L255 273 M255 147 L217 169 M326 270 L288 292"/>
  </g>
  <circle cx="326" cy="188" r="96" fill="none" stroke="url(#rim)" stroke-width="7" opacity="0.9"/>
  <ellipse cx="292" cy="148" rx="34" ry="20" fill="#ffffff" opacity="0.55" transform="rotate(-35 292 148)" filter="url(#blur10)"/>

  <!-- tile edge highlight -->
  <rect x="17.5" y="17.5" width="477" height="477" rx="116.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
</svg>
